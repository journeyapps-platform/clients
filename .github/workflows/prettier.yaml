name: Prettier check

on:
  pull_request:

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-pnpm

      - name: Prettier
        run: pnpm prettier --check --ignore-path .prettierignore --config .prettierrc '**/*.{ts,tsx,js,jsx}'
